# -----------------------------------------------------------------------------
# NetApp (Trident) tiers — external storage
#   netapp-san-performance : ontap-san / NVMe/TCP (DEFAULT external block), raw block RWX
#   netapp-san-iscsi       : ontap-san / iSCSI (fallback), raw block RWX
#   netapp-nas-capacity    : ontap-nas / NFS, filesystem only
# "selector" matches the UNIQUE "pool" label on each TridentBackendConfig
# (02-storage-drivers). Do not select on "tier" alone: both SAN backends carry
# tier=performance, so Trident could place a volume on either protocol.
# The cluster-wide default StorageClass stays lh-performance (local Longhorn);
# see docs/storage-design.md for why and how to change it.
# -----------------------------------------------------------------------------
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: netapp-san-performance
  annotations:
    description: "External tier 1 (default external block) - NetApp AFF over NVMe/TCP, RWX block"
provisioner: csi.trident.netapp.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  backendType: ontap-san
  selector: "pool=san-nvme"
  provisioningType: thin
  snapshots: "true"
  clones: "true"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: netapp-san-iscsi
  annotations:
    description: "External tier 1 fallback - NetApp AFF over iSCSI, RWX block"
provisioner: csi.trident.netapp.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  backendType: ontap-san
  selector: "pool=san-iscsi"
  provisioningType: thin
  snapshots: "true"
  clones: "true"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: netapp-nas-capacity
  annotations:
    description: "External tier 2 - NetApp NFSv4.1, filesystem volumes"
provisioner: csi.trident.netapp.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4.1
  - hard
  - nconnect=8
parameters:
  backendType: ontap-nas
  selector: "pool=nas-nfs"
  provisioningType: thin
  snapshots: "true"
