# -----------------------------------------------------------------------------
# NetApp ONTAP SAN (iSCSI) backend -> FALLBACK block tier on external storage.
# NVMe/TCP (backend-ontap-san-nvme.yaml) is the default. Keep this for VMs/LUNs
# that must stay on iSCSI (e.g. migrated RDM-style LUNs, troubleshooting).
# Remove this file + cloudinit-multipath.yaml if iSCSI is never needed.
# Docs: https://docs.netapp.com/us-en/trident/trident-use/ontap-san-examples.html
# -----------------------------------------------------------------------------
apiVersion: trident.netapp.io/v1
kind: TridentBackendConfig
metadata:
  name: ontap-san-iscsi
  namespace: trident
spec:
  version: 1
  storageDriverName: ontap-san
  backendName: ontap-san-iscsi
  managementLIF: 10.10.10.200
  svm: svm_harvester
  sanType: iscsi
  useCHAP: true
  credentials:
    name: backend-ontap-secret
  limitVolumeSize: 8Ti
  defaults:
    spaceReserve: none           # thin
    spaceAllocation: "true"      # SCSI UNMAP -> space reclaim from guests
    snapshotPolicy: none         # snapshots driven by K8s/Kasten, not ONTAP schedules
    snapshotReserve: "0"
    encryption: "false"          # set "true" if NVE/NAE licensed
  labels:
    tier: performance
    protocol: iscsi
    pool: san-iscsi              # unique label -> StorageClass selector targets ONLY this backend
