# Copy to backend-ontap-secret.secret.yaml (git-ignored), fill in, apply.
# Use a dedicated SVM-scoped ONTAP user with the Trident role, not admin.
apiVersion: v1
kind: Secret
metadata:
  name: backend-ontap-secret
  namespace: trident
type: Opaque
stringData:
  username: trident-svc
  password: CHANGE_ME
  # Bidirectional CHAP for iSCSI (ontap-san)
  chapUsername: harvester-initiator
  chapInitiatorSecret: CHANGE_ME_12to16chars
  chapTargetUsername: svm-harvester-target
  chapTargetInitiatorSecret: CHANGE_ME_12to16chars
