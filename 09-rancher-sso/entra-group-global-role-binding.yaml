# grb-sg-rancher-user-base: Gives the Entra ID group azuread_group://f5644315-9653-43c3-b239-41cab3792871 the Rancher global role user-base, so its
# members get basic access (log in and little else) when they sign in through Entra SSO on rancher.ct.local. Apply it on the Rancher management
# (local) cluster only. The group must also be listed in allowedPrincipalIds, and it needs a cluster or project binding to see anything useful.
#
#   kubectl diff   -f config/rancher/rancher-entra-group-grb-user-base.yaml
#   kubectl apply  -f config/rancher/rancher-entra-group-grb-user-base.yaml
#   kubectl get globalrolebinding grb-sg-rancher-user-base -o yaml
#   kubectl delete -f config/rancher/rancher-entra-group-grb-user-base.yaml

apiVersion: management.cattle.io/v3
kind: GlobalRoleBinding
metadata:
  name: grb-sg-rancher-user-base
globalRoleName: user-base
groupPrincipalName: azuread_group://f5644315-9653-43c3-b239-41cab3792871