# crtb-sg-harvester-view-nodes: Gives the Entra ID group azuread_group://f5644315-9653-43c3-b239-41cab3792871 the cluster role nodes-view
# ("View Nodes") on the Rancher-managed cluster c-hprl5, which is assumed to be the imported Harvester cluster. View only: no project, namespace
# or workload access. Apply it on the Rancher management (local) cluster, not on Harvester. The group must also be allowed to log in
# (allowedPrincipalIds).
#
#   kubectl diff   -f config/rancher/rancher-entra-group-crtb-view-nodes.yaml
#   kubectl apply  -f config/rancher/rancher-entra-group-crtb-view-nodes.yaml
#   kubectl get clusterroletemplatebinding crtb-sg-harvester-view-nodes -n c-hprl5 -o yaml
#   kubectl delete -f config/rancher/rancher-entra-group-crtb-view-nodes.yaml

apiVersion: management.cattle.io/v3
kind: ClusterRoleTemplateBinding
metadata:
  name: crtb-sg-harvester-view-nodes
  namespace: c-hprl5
clusterName: c-hprl5
roleTemplateName: nodes-view
groupPrincipalName: azuread_group://f5644315-9653-43c3-b239-41cab3792871