# prtb-sg-vm-managers: Gives the Entra ID group azuread_group://f5644315-9653-43c3-b239-41cab3792871 the project role virt-project-manage
# ("Manage Virtualization Resources") on project p-z5fxr of cluster c-hprl5 (assumed to be the Harvester cluster). Members can manage VMs and
# related resources in that project only. Apply it on the Rancher management (local) cluster, not on Harvester. The group also needs login
# access (allowedPrincipalIds) and a global role such as user-base.
#
#   kubectl diff   -f config/rancher/rancher-entra-group-prtb-vm-manage.yaml
#   kubectl apply  -f config/rancher/rancher-entra-group-prtb-vm-manage.yaml
#   kubectl get projectroletemplatebinding prtb-sg-vm-managers -n c-hprl5-p-z5fxr -o yaml
#   kubectl delete -f config/rancher/rancher-entra-group-prtb-vm-manage.yaml

apiVersion: management.cattle.io/v3
kind: ProjectRoleTemplateBinding
metadata:
  name: prtb-sg-vm-managers
  namespace: c-hprl5-p-z5fxr
projectName: c-hprl5:p-z5fxr
roleTemplateName: virt-project-manage
groupPrincipalName: azuread_group://f5644315-9653-43c3-b239-41cab3792871