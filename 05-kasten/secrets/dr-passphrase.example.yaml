# Kasten DR passphrase — needed to restore the Kasten catalog after losing the
# cluster. Store a copy OUTSIDE this cluster (password vault). Enable the DR
# policy from the Kasten UI (Settings > Disaster Recovery) pointing at s3-immutable;
# its spec format changes between Kasten versions, so it is not templated here.
apiVersion: v1
kind: Secret
metadata:
  name: k10-dr-secret
  namespace: kasten-io
type: Opaque
stringData:
  key: CHANGE_ME_LONG_RANDOM_PASSPHRASE
