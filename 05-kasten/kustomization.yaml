apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Pre-req: Kasten installed with k10-helmchart.yaml (it brings the Profile/Policy
# CRDs), the ct.local certificate/CA in place (11-cert-manager), and secrets in
# secrets/ created out-of-band (from *.example.yaml) BEFORE applying the profiles.
resources:
  - location-profiles.yaml
  - policies.yaml
