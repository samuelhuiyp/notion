# k10-rpc-vm-test: Gives the vm-test user rancher:<CHANGE_ME> (Rancher user ID with Kasten's "rancher:" prefix, the same subject that has
# k10-basic in vm-test) the k10-rpc-vm-test ClusterRole on the Harvester cluster. Although it is a ClusterRoleBinding, the role only names
# vm-test's RestorePointContents. Fill the user at apply time with sed.
#
#   sed "s|rancher:<CHANGE_ME>|rancher:$VMTEST_USER|" 05-kasten/rbac/vm-test-restorepoints/k10-rpc-vm-test-binding.yaml | kubectl apply -f -
#   kubectl auth can-i delete restorepointcontents.apps.kio.kasten.io/<vm-test-rpc-name> --as "rancher:$VMTEST_USER"   # yes
#   kubectl auth can-i delete restorepointcontents.apps.kio.kasten.io/<other-ns-rpc-name> --as "rancher:$VMTEST_USER"  # no
#   kubectl delete clusterrolebinding k10-rpc-vm-test

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k10-rpc-vm-test
  labels:
    app.kubernetes.io/part-of: k10-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k10-rpc-vm-test
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: "rancher:<CHANGE_ME>"
