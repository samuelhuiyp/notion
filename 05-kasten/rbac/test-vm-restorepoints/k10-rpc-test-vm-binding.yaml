# k10-rpc-test-vm: Gives the test-vm user rancher:m-66rfb (Rancher user m-66rfb with Kasten's "rancher:" prefix, the same subject that has
# k10-basic in test-vm via 05-kasten/rbac/k10-basic-test-vm-binding.yaml) the k10-rpc-test-vm ClusterRole on the Harvester cluster. Although
# it is a ClusterRoleBinding, the role only names test-vm's RestorePointContents.
#
#   kubectl apply  -f 05-kasten/rbac/test-vm-restorepoints/k10-rpc-test-vm-binding.yaml
#   kubectl auth can-i delete restorepointcontents.apps.kio.kasten.io/<test-vm-rpc-name> --as rancher:m-66rfb   # yes
#   kubectl auth can-i delete restorepointcontents.apps.kio.kasten.io/<other-ns-rpc-name> --as rancher:m-66rfb  # no
#   kubectl delete -f 05-kasten/rbac/test-vm-restorepoints/k10-rpc-test-vm-binding.yaml

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k10-rpc-test-vm
  labels:
    app.kubernetes.io/part-of: k10-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k10-rpc-test-vm
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: "rancher:m-66rfb"
