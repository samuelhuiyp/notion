apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Apply on Harvester after Kasten.
# Re-applying the ClusterRole from Git only resets it to the placeholder (fewer rights, never more)
# until the next sync run.
resources:
  - k10-rpc-test-vm-clusterrole.yaml
  - k10-rpc-test-vm-binding.yaml
  - k10-rpc-sync.yaml
