# harvester-template-default-versions-v2: Points the 8 Windows/Linux VM templates in namespace harvester-public at their new v2 template versions
# (spec.defaultVersionId). Only that field is set; descriptions and the version objects themselves are not touched. Apply on the Harvester cluster
# after all eight v2 VirtualMachineTemplateVersion files exist. Do NOT use "kubectl delete -f" on this file: it would delete the templates.
# Roll back by changing defaultVersionId back to the previous version name (see the comment above each document).
#
#   kubectl get virtualmachinetemplate -n harvester-public -o custom-columns=NAME:.metadata.name,DEFAULT:.spec.defaultVersionId
#   kubectl diff   -f harvester-template-default-versions-v2.yaml
#   kubectl apply  -f harvester-template-default-versions-v2.yaml
#   kubectl get virtualmachinetemplate -n harvester-public -o custom-columns=NAME:.metadata.name,DEFAULT:.spec.defaultVersionId

# windows-iso-small-template: previous default windows-iso-small-optimized
apiVersion: harvesterhci.io/v1beta1
kind: VirtualMachineTemplate
metadata:
  name: windows-iso-small-template
  namespace: harvester-public
spec:
  defaultVersionId: harvester-public/windows-iso-small-optimized-v2
---
