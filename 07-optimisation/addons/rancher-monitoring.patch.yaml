# kubectl -n cattle-monitoring-system patch addon rancher-monitoring --type merge \
#   --patch-file 07-optimisation/addons/rancher-monitoring.patch.yaml
# Persistent Prometheus on the capacity tier, 15 days retention.
spec:
  enabled: true
  valuesContent: |
    prometheus:
      prometheusSpec:
        retention: 15d
        retentionSize: 45GiB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: lh-capacity
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
        resources:
          requests: {cpu: 750m, memory: 2Gi}
          limits:   {cpu: "2",  memory: 6Gi}
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: lh-capacity
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi
    grafana:
      persistence:
        enabled: true
        storageClassName: lh-capacity
        size: 5Gi
