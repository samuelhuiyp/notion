# -----------------------------------------------------------------------------
# Per-namespace quotas cap how much of the overcommitted pool one team can take.
# Quotas count REQUESTS (already reduced by overcommit-config) and limits.
# Live migration runs a 2nd virt-launcher pod for the VM until cut-over, so leave
# headroom >= your largest VM, otherwise migrations (and node drains!) are
# blocked by the quota.
# Sizing assumes 5 nodes x 128 threads x 1 TiB, minus 1 node for N+1.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ResourceQuota
metadata:
  name: vm-quota
  namespace: vm-prod
spec:
  hard:
    limits.cpu: "1024"              # vCPUs visible to guests
    limits.memory: 2Ti
    requests.cpu: "256"
    requests.memory: 1800Gi
    requests.storage: 60Ti
    persistentvolumeclaims: "500"
    lh-capacity.storageclass.storage.k8s.io/requests.storage: 30Ti
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: vm-quota
  namespace: vm-dmz
spec:
  hard:
    limits.cpu: "128"
    limits.memory: 256Gi
    requests.cpu: "32"
    requests.memory: 220Gi
    requests.storage: 10Ti
    persistentvolumeclaims: "100"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: vm-quota
  namespace: vm-dev
spec:
  hard:
    limits.cpu: "256"
    limits.memory: 512Gi
    requests.cpu: "64"
    requests.memory: 430Gi
    requests.storage: 20Ti
    persistentvolumeclaims: "200"
    # dev must not consume the NVMe tier
    lh-performance.storageclass.storage.k8s.io/requests.storage: "0"
    lh-performance-retain.storageclass.storage.k8s.io/requests.storage: "0"
    netapp-san-performance.storageclass.storage.k8s.io/requests.storage: "0"
    netapp-san-iscsi.storageclass.storage.k8s.io/requests.storage: "0"
    px-performance.storageclass.storage.k8s.io/requests.storage: "0"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: vm-quota
  namespace: rke2-guests
spec:
  hard:
    limits.cpu: "256"
    limits.memory: 768Gi
    requests.cpu: "64"
    requests.memory: 650Gi
    requests.storage: 20Ti
