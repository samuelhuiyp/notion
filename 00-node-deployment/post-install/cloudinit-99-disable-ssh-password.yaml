apiVersion: node.harvesterhci.io/v1beta1
kind: CloudInit
metadata:
  name: ssh-no-password
spec:
  matchSelector:
    harvesterhci.io/managed: "true"
  filename: 99-ssh-no-password
  contents: |
    stages:
      network:
        - name: "disable ssh password auth"
          files:
            - path: /etc/ssh/sshd_config.d/99-no-password.conf
              permissions: 0600
              owner: 0
              group: 0
              content: |
                PasswordAuthentication no
                KbdInteractiveAuthentication no