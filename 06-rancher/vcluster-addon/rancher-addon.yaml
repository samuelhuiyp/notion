# rancher-vcluster: Enables the experimental Harvester add-on that runs Rancher Manager v2.14.0 inside a K3s vCluster in namespace
# rancher-vcluster on the Harvester cluster, served at https://rancher.ct.local with the cert-manager certificate *.ct.local. The host
# Secrets rancher-vcluster/wildcard-ct-local-tls and rancher-vcluster/tls-ca (from 11-cert-manager and scripts/publish-ct-local-ca.sh)
# are synced into the vCluster as cattle-system/tls-rancher-ingress and cattle-system/tls-ca. Replace <CHANGE_ME> before applying.
#
#   kubectl diff   -f 06-rancher/vcluster-addon/rancher-addon.yaml
#   kubectl apply  -f 06-rancher/vcluster-addon/rancher-addon.yaml
#   curl --cacert ct-local-root-ca.crt -sS -o /dev/null -w '%{http_code}\n' https://rancher.ct.local/ping
#   kubectl delete -f 06-rancher/vcluster-addon/rancher-addon.yaml

# Namespace that holds the add-on, the vCluster workload and the host-side TLS secrets
apiVersion: v1
kind: Namespace
metadata:
  name: rancher-vcluster
---
# The add-on itself (a wrapper around an RKE2 HelmChart for the vcluster chart)
apiVersion: harvesterhci.io/v1beta1
kind: Addon
metadata:
  name: rancher-vcluster
  namespace: rancher-vcluster
  labels:
    addon.harvesterhci.io/experimental: "true"
spec:
  enabled: true
  repo: https://charts.loft.sh
  version: "v0.30.0"
  chart: vcluster
  valuesContent: |-
    global:
      hostname: "rancher.ct.local"   # DNS record pointing to the Harvester VIP
      rancherVersion: v2.14.0
      # Initial admin password, only used until first login. Set it at apply time
      # (e.g. sed/envsubst from your vault); never commit the real value.
      bootstrapPassword: "<CHANGE_ME>"

    sync:
      toHost:
        ingresses:
          enabled: true
      # Bring the cert-manager certificate and the CA from the Harvester host into the vCluster.
      # Format "host-namespace/name": "virtual-namespace/name".
      fromHost:
        secrets:
          enabled: true
          mappings:
            byName:
              "rancher-vcluster/wildcard-ct-local-tls": "cattle-system/tls-rancher-ingress"
              "rancher-vcluster/tls-ca": "cattle-system/tls-ca"

    controlPlane:
      distro:
        k3s:
          enabled: true
          image:
            registry: ""
            repository: "rancher/k3s"
            tag: "v1.35.4-k3s1"
          securityContext: {}
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 40m
              memory: 64Mi
      backingStore:
        database:
          embedded:
            enabled: true

      statefulSet:
        image:
          registry: "ghcr.io"
          repository: "loft-sh/vcluster-pro"
          tag: "0.30.0"
        resources:
          limits:
            ephemeral-storage: 10Gi
            memory: 4Gi
          requests:
            ephemeral-storage: 1Gi
            cpu: 200m
            memory: 256Mi

    experimental:
      deploy:
        vcluster:
          # cert-manager is not deployed inside the vCluster any more: Rancher uses the
          # certificate supplied from the host (ingress.tls.source=secret).
          manifestsTemplate: |-
            apiVersion: v1
            kind: Namespace
            metadata:
              name: cattle-system
            ---
            apiVersion: helm.cattle.io/v1
            kind: HelmChart
            metadata:
              name: rancher
              namespace: kube-system
            spec:
              targetNamespace: cattle-system
              repo: https://releases.rancher.com/server-charts/latest
              chart: rancher
              version: {{ .Values.global.rancherVersion }}
              set:
                hostname: {{ .Values.global.hostname }}
                ingress.tls.source: secret   # uses cattle-system/tls-rancher-ingress
                privateCA: "true"            # uses cattle-system/tls-ca (cacerts.pem); agents get the CA checksum
                replicas: 1
                global.cattle.psp.enabled: "false"
                bootstrapPassword: {{ .Values.global.bootstrapPassword }}
              helmVersion: v3
