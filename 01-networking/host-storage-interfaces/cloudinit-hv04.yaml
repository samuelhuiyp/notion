# -----------------------------------------------------------------------------
# Host-level interfaces for EXTERNAL storage on hv04 (iSCSI A/B, NFS, Portworx data).
# Why host-level: Harvester cluster networks only give VMs/pods L2 access; CSI
# node plugins (Trident, NFS CSI, Portworx) run in the host network namespace and
# need a host IP on the storage VLANs.
#
# Mechanism: Harvester CloudInit CRD -> file in /oem -> applied at boot (requires reboot).
# Format: wicked ifcfg (SLE Micro 5.x based Harvester). If your Harvester release
# is based on SL Micro 6 / NetworkManager, convert to keyfiles — VERIFY before use.
# Docs: https://docs.harvesterhci.io/latest/advanced/cloudinitcrd
#
# Design: ens2f1+ens3f1 LACP bond (physical redundancy) + two iSCSI VLANs on
# separate subnets so dm-multipath sees >= 2 independent paths per LUN.
# -----------------------------------------------------------------------------
apiVersion: node.harvesterhci.io/v1beta1
kind: CloudInit
metadata:
  name: ext-storage-net-hv04
spec:
  matchSelector:
    kubernetes.io/hostname: hv04
  filename: 95_ext_storage_net.yaml
  contents: |
    stages:
      initramfs:
        - name: "external storage bond and VLANs"
          files:
            - path: /etc/sysconfig/network/ifcfg-ens2f1
              permissions: 384
              content: |
                STARTMODE='hotplug'
                BOOTPROTO='none'
            - path: /etc/sysconfig/network/ifcfg-ens3f1
              permissions: 384
              content: |
                STARTMODE='hotplug'
                BOOTPROTO='none'
            - path: /etc/sysconfig/network/ifcfg-bond-ext
              permissions: 384
              content: |
                STARTMODE='onboot'
                BOOTPROTO='none'
                BONDING_MASTER='yes'
                BONDING_SLAVE_0='ens2f1'
                BONDING_SLAVE_1='ens3f1'
                BONDING_MODULE_OPTS='mode=802.3ad miimon=100 lacp_rate=fast xmit_hash_policy=layer3+4'
                MTU='9000'
            - path: /etc/sysconfig/network/ifcfg-bond-ext.21
              permissions: 384
              content: |
                STARTMODE='onboot'
                BOOTPROTO='static'
                ETHERDEVICE='bond-ext'
                VLAN_ID='21'
                IPADDR='10.10.21.14/24'
                MTU='9000'
            - path: /etc/sysconfig/network/ifcfg-bond-ext.22
              permissions: 384
              content: |
                STARTMODE='onboot'
                BOOTPROTO='static'
                ETHERDEVICE='bond-ext'
                VLAN_ID='22'
                IPADDR='10.10.22.14/24'
                MTU='9000'
            - path: /etc/sysconfig/network/ifcfg-bond-ext.23
              permissions: 384
              content: |
                STARTMODE='onboot'
                BOOTPROTO='static'
                ETHERDEVICE='bond-ext'
                VLAN_ID='23'
                IPADDR='10.10.23.14/24'
                MTU='9000'
            - path: /etc/sysconfig/network/ifcfg-bond-ext.24
              permissions: 384
              content: |
                STARTMODE='onboot'
                BOOTPROTO='static'
                ETHERDEVICE='bond-ext'
                VLAN_ID='24'
                IPADDR='10.10.24.14/24'
                MTU='9000'
  paused: false
